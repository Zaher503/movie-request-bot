services:
  movie-bot:
    build: .
    image: ghcr.io/zaher503/movie-request-bot:${TAG:-latest}
    container_name: movie-bot
    restart: unless-stopped
    mem_limit: 192m
    ports:
      - 127.0.0.1:8790:8000
    env_file: .env
    environment:
      SEERR_URL: http://media-seerr:5055
      RADARR_URL: http://media-radarr:7878
      SONARR_URL: http://media-sonarr:8989
      QBIT_URL: http://media-qbittorrent:8080
      JELLYFIN_URL: http://media-jellyfin:8096
      DELETE_SENDERS: "zaher,kathy"
      PUBLIC_BASE: https://zaher.site
      TZ: America/Los_Angeles
      DAILY_LIMIT: "5"
      LIST_TTL: "900"
      UNDO_TTL: "180"
      PAGE_SIZE: "5"
    volumes:
      - movie-bot-data:/data
    networks:
      - media-stack

networks:
  media-stack:
    external: true

volumes:
  movie-bot-data:
    driver: local
