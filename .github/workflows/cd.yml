name: CD

# After CI passes on main: publish the image to GHCR, then update the stack on the NAS.
# The runner is on the NAS (label = repo name) and deploys into the Dockge stack folder.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NAME: movie-request-bot  # repo name and image name
  PORT: "8790"            # host port checked at /healthz after the deploy
  STACK: /mnt/.ix-apps/app_mounts/dockge/stacks/movie-bot  # Dockge stack folder on the NAS
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zaher503/${{ env.NAME }}:latest
            ghcr.io/zaher503/${{ env.NAME }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    # Self-hosted runner on the NAS (/mnt/SSDs/home/Claude/actions-runner-movie-request-bot)
    runs-on: [self-hosted, movie-request-bot]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Update the stack
        run: |
          cp compose.yaml ${STACK}/compose.yaml
          cd ${STACK}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d
          docker image prune -f
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:${PORT}/healthz && exit 0
            sleep 2
          done
          docker compose -f ${STACK}/compose.yaml logs --tail 50
          exit 1
